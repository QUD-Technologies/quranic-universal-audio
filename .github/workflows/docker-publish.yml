name: Inspector checks & Docker image

on:
  push:
    branches:
      - main
      - 'inspector-**'
      - 'worktree-**'
    tags:
      - 'v*'
    paths:
      - 'inspector/**'
      - 'qua_shared/**'
      - 'qua_jobs/**'
      - 'scripts/**'
      - '.github/config/**'
      - 'docs/templates/**'
      - '.github/workflows/**'
      - '.dockerignore'
      - 'ruff.toml'
      - 'pyrightconfig.json'
      - '.python-version'
      - '.nvmrc'
  pull_request:
    paths:
      - 'inspector/**'
      - 'qua_shared/**'
      - 'qua_jobs/**'
      - 'scripts/**'
      - '.github/config/**'
      - 'docs/templates/**'
      - '.github/workflows/**'
      - '.dockerignore'
      - 'ruff.toml'
      - 'pyrightconfig.json'
      - '.python-version'
      - '.nvmrc'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to GHCR (false = build-only smoke test)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read
  packages: write
  # pull-requests: write so the reusable inspector-checks.yml frontend-checks
  # job can post eslint --fix review suggestions on PRs (reviewdog). A reusable
  # job's permissions are capped by the caller, so the caller must grant it.
  pull-requests: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/inspector

jobs:
  checks:
    uses: ./.github/workflows/inspector-checks.yml
    secrets: inherit

  build:
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Lowercase image name
        id: img
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to push
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "push=${{ inputs.push }}" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.decide.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: inspector/Dockerfile
          push: ${{ steps.decide.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          # qua-domain (the four riwayat's scripts/fonts/projection) is fetched
          # by a Dockerfile stage from the private monorepo. `required=false` at
          # the mount, so a missing secret yields a Hafs-only image, not a
          # failed build.
          # Quoted: docker/build-push-action splits the `secrets` input on
          # newlines, so an unquoted multi-line value delivers only its first
          # line and the container gets an unparseable key.
          secrets: |
            "PRIVATE_REPO_TOKEN=${{ secrets.PAT_TOKEN }}"

      - name: Summary
        run: |
          echo "### Image tags" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed: ${{ steps.decide.outputs.push }}" >> "$GITHUB_STEP_SUMMARY"
