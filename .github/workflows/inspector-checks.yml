name: Inspector checks (reusable)

# Reusable workflow: frontend + backend checks for the inspector.
# Called by docker-publish.yml (build gate) and inspector-deploy.yml (deploy gate).

on:
  workflow_call:
    secrets:
      CELLS_DEPLOY_KEY:
        description: Read-only SSH deploy key for the private renderer repository
        required: true
      QUA_DOMAIN_DEPLOY_KEY:
        description: >-
          Read-only SSH deploy key for QUD-Technologies/qua, source of the qua-domain
          edition package. Optional: without it the backend tests exercise the
          Hafs-only degraded path instead of the real edition data.
        required: false

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # pull-requests: write lets reviewdog post review suggestions on PRs.
      pull-requests: write
    defaults:
      run:
        working-directory: inspector/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: inspector/frontend/package-lock.json

      - name: Configure private renderer access
        env:
          CELLS_DEPLOY_KEY: ${{ secrets.CELLS_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CELLS_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Install deps
        run: npm ci

      - name: Autofix lint (import sort + other auto-fixable rules)
        # Apply auto-fixes in-place so the diff can be surfaced as PR
        # suggestions below. We NEVER commit/push back to the branch — on
        # pull_request events the diff becomes reviewdog review suggestions;
        # on branch pushes it is simply discarded.
        run: npx eslint --fix src/ || true

      - name: Suggest eslint --fix changes (PR only)
        if: github.event_name == 'pull_request'
        # Advisory only — surfaces eslint --fix as PR suggestions. A reviewdog
        # infra hiccup (e.g. "shallow file has changed" during its git fetch on
        # the shallow checkout) must never gate the build; the real gates are
        # the lint/check/test/build step below.
        continue-on-error: true
        uses: reviewdog/action-suggester@v1
        with:
          tool_name: eslint
          # Limit the suggester to the frontend tree it just fixed.
          filter_mode: diff_context

      - name: Discard autofix diff before checks
        # The checks below run against the committed sources; eslint's own
        # `npm run lint` step re-checks for any non-auto-fixable issues. Reset
        # so a clean checkout drives lint/check/test/build deterministically.
        run: git checkout -- src/ || true

      - name: Lint (non-blocking)
        # Advisory — eslint findings surface but never gate the build. The real
        # gates are typecheck/test/build below.
        continue-on-error: true
        run: npm run lint

      - name: Typecheck, test (with coverage), build
        run: |
          npm run check
          npm run test:coverage
          npm run build

  backend-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: inspector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            inspector/requirements.txt
            inspector/requirements-dev.txt

      - name: Install qua-domain (multi-riwayah edition data)
        working-directory: ${{ github.workspace }}
        env:
          QUA_DOMAIN_DEPLOY_KEY: ${{ secrets.QUA_DOMAIN_DEPLOY_KEY }}
        # Exits 0 having installed nothing when the secret is absent (a fork).
        # The edition tests then skip and the degraded-path tests still run.
        run: python scripts/devenv/install_qua_domain.py

      - name: Install deps and run pytest
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml:.coverage.xml --no-cov-on-fail

      - name: Run shared-package (qua_shared) tests
        # qua_shared/ is a root-level package imported by the app; its tests
        # assert byte-parity with inspector internals (e.g. peaks_slim), so they
        # need both repo root and inspector/ on the path. The inspector run above
        # never collects them (testpaths = inspector/tests).
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/inspector
        run: python -m pytest qua_shared/tests --cov=qua_shared --cov-report=term-missing:skip-covered --no-cov-on-fail

      - name: Run bucket-script (scripts/bucket) tests
        # scripts/bucket/ holds the operational CLIs (promote_run and friends).
        # Like qua_shared, they need both repo root and inspector/ on the path,
        # and the inspector run above never collects them. No coverage: the
        # directory is mostly one-shot CLIs, so the report would be noise.
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/inspector
        run: python -m pytest scripts/bucket/tests

      - name: Run devenv-script (scripts/devenv) tests
        # Same shape as the bucket-script step: flat CLI modules that need both
        # repo root and inspector/ on the path. The synthetic-delivery builder
        # is the fixture every multi-riwayah verification runs against, so its
        # coordinates and shard audit are worth gating.
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/inspector
        run: python -m pytest scripts/devenv/tests

      - name: Run backfill-script (scripts/backfills) tests
        # One-shot bucket rewrites; the pure rule each applies is what's gated.
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/inspector
        run: python -m pytest scripts/backfills/tests

      # Ruff (lint + format) is enforced locally by the pre-commit + pre-push
      # git hooks (see .husky/ + scripts/devenv/setup.sh), not in CI — it never
      # gated the build here and the reviewdog PR suggestions were noise.

  schema-codegen-check:
    # Verifies inspector/frontend/src/lib/types/generated/schemas.ts is in
    # lockstep with qua_shared/schemas/. If a backend pydantic schema
    # changes and the dev forgot to regen the FE types, this job fails
    # with `git diff --exit-code` on the generated file. See
    # docs/reference/data-migrations.md §5 and scripts/codegen/regen_fe_types.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: inspector/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: inspector/frontend/package-lock.json

      - name: Configure private renderer access
        env:
          CELLS_DEPLOY_KEY: ${{ secrets.CELLS_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CELLS_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Install codegen deps
        run: |
          # Install runtime requirements alongside dev requirements so codegen
          # runs against the same pinned pydantic the deployed image + the BE
          # tests use (prevents silent JSON-schema drift if
          # pydantic-to-typescript's loose dep resolves to an older pydantic).
          pip install -r inspector/requirements.txt -r inspector/requirements-dev.txt
          cd inspector/frontend && npm ci

      - name: Regenerate FE types
        run: python scripts/codegen/regen_fe_types.py

      - name: Verify no drift in generated/schemas.ts
        run: |
          if ! git diff --exit-code -- inspector/frontend/src/lib/types/generated/schemas.ts; then
            echo "::error::Generated FE types are out of sync. Run:"
            echo "::error::  python scripts/codegen/regen_fe_types.py"
            echo "::error::and commit the result."
            exit 1
          fi

  type-check:
    # Blocking pyright gate for the whole backend (inspector, qua_jobs,
    # qua_shared). Runtime + dev deps are installed first so pyright resolves
    # real third-party types — without them, imports collapse to Unknown and the
    # gate both misses real errors and reports spurious None-union ones. Pyright
    # itself is run via `npx`, so no type-checker dep is added to the image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            inspector/requirements.txt
            inspector/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend deps (for type resolution)
        run: pip install -r inspector/requirements.txt -r inspector/requirements-dev.txt

      - name: Pyright (basic, whole backend)
        run: >-
          npx -y pyright
          --pythonversion 3.11
          --level error
          inspector qua_jobs qua_shared

  scripts-layout-guard:
    # Stops the old scattered-scripts layout from creeping back. Imported-at-runtime
    # code is a package (qua_shared/ or qua_jobs/); operational CLIs live in
    # scripts/<function>/. There is no scripts/lib, scripts/jobs, or inspector/scripts.
    # See scripts/README.md for the placement rule.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No old scripts layout
        run: |
          bad_files=$(git ls-files 'scripts/lib/**' 'scripts/jobs/**' 'inspector/scripts/**')
          bad_imports=$(git grep -nE '^[[:space:]]*(from|import)[[:space:]]+scripts\.(lib|jobs)' -- '*.py' || true)
          if [ -n "$bad_files$bad_imports" ]; then
            echo "::error::Old scripts layout reintroduced — imported code → qua_shared/ or qua_jobs/; CLIs → scripts/<function>/. See scripts/README.md"
            [ -n "$bad_files" ] && { echo "Files in dead homes:"; echo "$bad_files"; }
            [ -n "$bad_imports" ] && { echo "Old scripts.lib/scripts.jobs imports:"; echo "$bad_imports"; }
            exit 1
          fi
          echo "scripts layout OK"

  services-flask-free:
    # services/ business logic stays framework-agnostic. The sole exception is
    # services/auth/auth.py, whose authlib flask_client OAuth integration is
    # irreducible. Any other flask/authlib import under services/ is a layering
    # violation — push it up to routes/ or down to adapters/. See CLAUDE.md +
    # docs/reference/architecture.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No Flask in services (except auth.py)
        run: |
          bad=$(git grep -nE '^[[:space:]]*(from|import)[[:space:]]+(flask|authlib)' -- 'inspector/services/' ':!inspector/services/auth/auth.py' || true)
          if [ -n "$bad" ]; then
            echo "::error::Flask/authlib imported in services/ outside the auth.py allow-list. Move it to routes/ or adapters/, or extend the allow-list in architecture.md if genuinely irreducible."
            echo "$bad"
            exit 1
          fi
          echo "services Flask-free OK"
