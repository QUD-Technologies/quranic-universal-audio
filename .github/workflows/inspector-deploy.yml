name: Deploy Inspector

on:
  push:
    branches: [dev, main]
    paths:
      - "inspector/**"
      - "qua_shared/**"
      - "qua_jobs/**"
      - "scripts/deploy/upload_inspector.py"
      - "data/surah_info.json"
      - "data/qpc_hafs.json"
      - "data/digital_khatt_v2_script.json"
      - "data/phoneme_sub_costs.json"
      - ".dockerignore"
      - "docs/templates/**"
      - ".github/workflows/inspector-deploy.yml"
  workflow_dispatch:
    inputs:
      env:
        description: "Target Space (auto follows the branch: dev→dev, main→prod). A dev-targeting manual dispatch skips checks for a fast deploy."
        type: choice
        options: [auto, dev, prod]
        default: auto
      verify_boot:
        description: "Build + boot the image and gate the deploy on /healthz (prod only; slow)."
        type: boolean
        default: false

# Deploy only checks out and uploads to the HF Space — it never writes back to
# the repo. But it calls the reusable inspector-checks.yml, whose frontend-checks
# job declares `pull-requests: write` (for reviewdog PR suggestions). A reusable
# job cannot request more than the caller grants, so the caller must grant it too
# or the run fails at startup — even though reviewdog's step is skipped on push.
# Mirrors docker-publish.yml (the other caller).
permissions:
  contents: read
  pull-requests: write

concurrency:
  # Avoid two pushes deploying simultaneously — the Hub upload is idempotent
  # but parallel rebuilds on the Space waste container time.
  group: inspector-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    # Fast-path dev deploys: a MANUAL dispatch that targets the dev Space skips
    # the full check suite (npm ci + build + pytest + coverage + codegen +
    # pyright) so iterating on dev is quick — the dev Space is a verification
    # target, not prod. Every push, and any prod-targeting dispatch, still runs
    # the full gate. A skipped `checks` is treated as non-blocking by deploy's
    # `if` below (skipped != failure).
    if: >-
      ${{ !(github.event_name == 'workflow_dispatch' &&
            (inputs.env == 'dev' ||
             (inputs.env == 'auto' && github.ref_name != 'main'))) }}
    uses: ./.github/workflows/inspector-checks.yml
    secrets: inherit

  # Opt-in, prod-only: build the image and assert it boots (/healthz) before
  # deploying. Runs ONLY on a manual workflow_dispatch with verify_boot=true
  # targeting prod — normal pushes skip it (a skipped `needs` doesn't block
  # deploy), so automatic deploys stay fast. The image builds the same
  # `context: .` the Space builds, then smoke_boot runs it offline (filesystem
  # fixtures, no secrets) and polls /healthz.
  boot-smoke:
    needs: [checks]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.verify_boot == true &&
      (inputs.env == 'prod' || (inputs.env == 'auto' && github.ref_name == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fixtures downloader
        run: pip install "huggingface_hub>=1.10"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: inspector/Dockerfile
          load: true
          tags: inspector-smoke:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          # qua-domain (the four riwayat's scripts/fonts/projection) is fetched
          # by a Dockerfile stage from the private monorepo. `required=false` at
          # the mount, so a missing secret yields a Hafs-only image, not a
          # failed build.
          # Quoted: docker/build-push-action splits the `secrets` input on
          # newlines, so an unquoted multi-line value delivers only its first
          # line and the container gets an unparseable key.
          secrets: |
            "PRIVATE_REPO_TOKEN=${{ secrets.PAT_TOKEN }}"

      - name: Boot smoke test (/healthz)
        run: python scripts/deploy/smoke_boot.py --skip-build --tag inspector-smoke:latest

  deploy:
    needs: [checks, boot-smoke]
    # Both `needs` may be skipped: boot-smoke on normal pushes, and checks on a
    # fast-path dev dispatch. A skipped `needs` would make the default
    # `if: success()` skip deploy too, so gate explicitly: deploy when checks did
    # NOT fail (success or skipped) and boot-smoke did NOT fail.
    if: >-
      ${{ always() &&
          (needs.checks.result == 'success' || needs.checks.result == 'skipped') &&
          needs.boot-smoke.result != 'failure' &&
          needs.boot-smoke.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: inspector/frontend/package-lock.json

      - name: Configure private renderer access
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          AUTH="$(printf 'x-access-token:%s' "$PRIVATE_REPO_TOKEN" | base64 -w0)"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"

      - name: Install frontend dependencies for Space staging
        working-directory: inspector/frontend
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install "huggingface_hub>=1.10"

      - name: Resolve target environment
        id: env
        run: |
          INPUT="${{ inputs.env }}"
          if [ -n "$INPUT" ] && [ "$INPUT" != "auto" ]; then
            echo "env=$INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${GITHUB_REF_NAME}" in
            dev)  echo "env=dev"  >> "$GITHUB_OUTPUT" ;;
            main) echo "env=prod" >> "$GITHUB_OUTPUT" ;;
            *)    echo "env=dev"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          python scripts/deploy/upload_inspector.py "${{ steps.env.outputs.env }}"
