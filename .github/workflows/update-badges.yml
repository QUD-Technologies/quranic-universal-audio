name: Update README badges

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-badges
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      QUD_SITE_DEPLOY_HOOK: ${{ secrets.QUD_SITE_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BADGE_PUSH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install 'huggingface_hub>=1.10'

      - name: Update README badges
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/codegen/update_readme_badges.py

      - name: Commit docs update
        run: |
          if git diff --quiet -- README.md data/stats.json; then
            echo "README badges already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md data/stats.json
          git commit -m "docs(readme): update badges"
          git push

      # qud.dev reads data/stats.json at build time; a rebuild picks up the new numbers.
      - name: Rebuild qud.dev
        if: env.QUD_SITE_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$QUD_SITE_DEPLOY_HOOK"
