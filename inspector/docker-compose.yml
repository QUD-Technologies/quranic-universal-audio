# Inspector — local Docker run.
#
# The container reads reciter content from the HF bucket
# (`hetchyy/quranic-inspector-bucket-dev` by default — set via
# INSPECTOR_BUCKET_REPO in the Dockerfile). Supply an HF token with
# write access to that bucket via `.env` (`INSPECTOR_HF_TOKEN=...`)
# alongside this file.
#
# To build from source instead of pulling, drop a `docker-compose.override.yml`
# next to this file:
#   services:
#     inspector:
#       image: !reset null
#       build:
#         context: ..
#         dockerfile: inspector/Dockerfile

services:
  inspector:
    image: ghcr.io/qud-technologies/inspector:latest
    container_name: inspector
    pull_policy: always
    ports:
      - "5000:7860"
    env_file:
      - .env
    restart: unless-stopped
