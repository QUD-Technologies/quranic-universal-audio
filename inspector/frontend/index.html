<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="/favicon-dark.webp" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/webp" href="/favicon-light.webp" media="(prefers-color-scheme: dark)">
    <title>Quranic Universal Audio</title>
    <!-- Flash-free theme: set data-theme on <html> synchronously, BEFORE any
         stylesheet parses, so the resolved theme paints on the first frame (no
         flash). Runs before the module graph (main.ts) loads. The 'insp_theme'
         key is duplicated from LS_KEYS.THEME (src/lib/utils/constants.ts) — keep
         in sync. Default MODE is 'system' (key absent) → follow the device's
         prefers-color-scheme; an explicit 'light'/'dark' in storage overrides.
         Same query as theme.svelte.ts's systemTheme() so the store agrees on
         mount. Works inside the HF Space iframe — prefers-color-scheme is a
         device signal, and if storage is blocked there we simply fall to system. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('insp_theme');
          if (t !== 'light' && t !== 'dark') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          var fallback = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', fallback);
        }
      })();
    </script>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
